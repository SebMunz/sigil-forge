name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deployment:
        description: Where to publish the validated artifact
        type: choice
        required: false
        default: none
        options:
          - none
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Retain tested site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.deployment == 'preview' || inputs.deployment == 'production'))) &&
      needs.validate.result == 'success'
    environment: ${{ inputs.deployment == 'preview' && 'preview' || 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: static-site
          path: deployment/dist
      - name: Check required deployment settings
        env:
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_PROJECT" && test -n "$CF_ACCOUNT" && test -n "$CF_TOKEN"
          [[ "$CF_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
          [[ "$CF_ACCOUNT" =~ ^[a-f0-9]{32}$ ]]
          test -f deployment/dist/index.html
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: node scripts/ensure-pages.mjs
      - name: Deploy only the validated artifact
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deployment
          packageManager: npm
          wranglerVersion: '4.151.3'
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ inputs.deployment == 'preview' && 'preview' || 'main' }}
